name: Python CI

on: [push] 
# usar o push para ativar 

jobs:
  build:
    # abre o linux virtualmente
    runs-on: ubuntu-latest 

    steps:
    - uses: actions/checkout@v4 

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests
      run: |
        # entra em cada uma daa pasta e roda o pytest
        cd Projetos_Python/projeto_calculadora && pytest
        cd ../estrutura_repeticao && pytest